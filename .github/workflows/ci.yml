name: Verify firmware

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every firmware file
        run: |
          sha256sum -c SHA256SUMS
          diff -u <(find google-factory -type f | sort) <(cut -d ' ' -f3- SHA256SUMS | sort)
